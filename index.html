<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATIVM Vocal Changer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { margin: 15px 0; padding: 10px; font-size: 16px; }
        button { background: #6200ee; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #3700b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>LATIVM Vocal Changer</h2>
        <p>Прикачи аудио фајл за трансформација:</p>
        <input type="file" id="audioFile" accept="audio/*"><br>
        <button onclick="processAudio()">Промени глас</button>
        <div id="status"></div>
    </div>

    <script>
        function processAudio() {
            const fileInput = document.getElementById('audioFile');
            const status = document.getElementById('status');
            if (fileInput.files.length > 0) {
                status.innerHTML = "Фајлот е избран: " + fileInput.files[0].name + " (Чекаме поврзување со бекенд)";
            } else {
                status.innerHTML = "Те молам избери аудио фајл прво.";
            }
        }
    </script>
</body>
</html>
